[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defence-supply-radar"
version = "0.1.0"
description = "Offline-first local defence supply-chain radar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
defence-radar = "defence_radar.cli:main"

[tool.pytest.ini_options]
